<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - CineMAX Curator</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="container">
        <h1>CineMAX Content Curator</h1>
        <div class="module">
            <h2>1. Cari & Tambahkan Film dari TMDB</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Cari judul film...">
                <button id="search-btn">Cari</button>
            </div>
            <div id="search-results" class="results-grid"></div>
        </div>
        <div class="module">
            <h2>2. Film yang Saat Ini Ada di Situs Anda</h2>
            <div class="table-container">
                <table id="movie-list-table">
                    <thead>
                        <tr>
                            <th>Poster</th>
                            <th>Judul</th>
                            <th>Kategori</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="movie-list-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
