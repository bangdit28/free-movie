<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMAX - Hiburan Tanpa Batas</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <button class="hamburger-menu"><i class="fas fa-bars"></i></button>
            <a href="index.html" class="logo">CineMAX</a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link active">Beranda</a>
                <a href="#" class="nav-link">Serial</a>
                <a href="#" class="nav-link">Film</a>
                <a href="#" class="nav-link">Daftar Saya</a>
            </nav>
            <div class="user-nav">
                <button class="nav-action"><i class="fas fa-search"></i></button>
                <button class="nav-action"><i class="fas fa-bell"></i></button>
                <div class="profile-dropdown">
                    <img src="https://i.pravatar.cc/40" alt="User Profile" class="profile-pic">
                    <i class="fas fa-caret-down"></i>
                </div>
            </div>
        </div>
    </header>

    <div class="nav-overlay"></div>
    <nav class="mobile-nav">
        <div class="mobile-nav-header">
            <div class="profile-info">
                <img src="https://i.pravatar.cc/40" alt="User Profile" class="profile-pic">
                <span>Nama Profil</span>
            </div>
            <button class="close-btn">&times;</button>
        </div>
        <ul class="mobile-nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Beranda</a></li>
            <li><a href="#"><i class="fas fa-tv"></i> Serial</a></li>
            <li><a href="#"><i class="fas fa-film"></i> Film</a></li>
            <li><a href="#"><i class="fas fa-plus"></i> Daftar Saya</a></li>
            <li><a href="#"><i class="fas fa-tag"></i> Genre</a></li>
        </ul>
    </nav>

    <section class="hero-section">
        <img src="" alt="Hero Background" class="hero-background" id="hero-bg">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="featured-title" id="hero-title">Memuat Film...</h1>
            <p class="featured-desc" id="hero-desc"></p>
            <div class="hero-buttons">
                <button class="btn btn-play" id="hero-play-btn"><i class="fas fa-play"></i> Putar</button>
                <button class="btn btn-info" id="hero-info-btn"><i class="fas fa-info-circle"></i> Info Selengkapnya</button>
            </div>
        </div>
    </section>

    <main class="main-content">
        <section class="content-row">
            <h2 class="row-title">Paling Populer</h2>
            <div class="carousel-wrapper">
                <button class="carousel-arrow prev"><i class="fas fa-chevron-left"></i></button>
                <div class="movie-carousel" id="populer-carousel"></div>
                <button class="carousel-arrow next"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
        <section class="content-row">
            <h2 class="row-title">Baru Dirilis</h2>
            <div class="carousel-wrapper">
                <button class="carousel-arrow prev"><i class="fas fa-chevron-left"></i></button>
                <div class="movie-carousel" id="baru-carousel"></div>
                <button class="carousel-arrow next"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
        <section class="content-row">
            <h2 class="row-title">Film Indonesia</h2>
            <div class="carousel-wrapper">
                <button class="carousel-arrow prev"><i class="fas fa-chevron-left"></i></button>
                <div class="movie-carousel" id="indonesia-carousel"></div>
                <button class="carousel-arrow next"><i class="fas fa-chevron-right"></i></button>
            </div>
        </section>
    </main>

    <script src="assets/js/main.js"></script>
</body>
</html>
