<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NusantaraFlix - Tonton di Mana Saja</title>
    <link rel="stylesheet" href="style.css">
    <!-- Impor Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Ikon (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>

    <!-- 1. HEADER / NAVIGASI UTAMA -->
    <header class="main-header">
        <div class="container">
            <a href="#" class="logo">NusantaraFlix</a>
            <nav class="main-nav">
                <a href="#" class="nav-link active">Beranda</a>
                <a href="#" class="nav-link">Serial TV</a>
                <a href="#" class="nav-link">Film</a>
                <a href="#" class="nav-link">Baru & Populer</a>
            </nav>
            <div class="user-nav">
                <i class="fas fa-search nav-icon"></i>
                <i class="fas fa-bell nav-icon"></i>
                <img src="https://via.placeholder.com/40" alt="User Profile" class="profile-pic">
            </div>
        </div>
    </header>

    <!-- 2. HERO SECTION (FILM UNGGULAN) -->
    <section class="hero-section">
        <!-- Background akan diatur via CSS -->
        <div class="hero-content">
            <h1 class="featured-title">Nama Film Unggulan</h1>
            <p class="featured-desc">Ini adalah sinopsis singkat beberapa kalimat tentang film unggulan yang sedang ditampilkan di hero section.</p>
            <div class="hero-buttons">
                <button class="btn btn-play"><i class="fas fa-play"></i> Putar</button>
                <button class="btn btn-info"><i class="fas fa-info-circle"></i> Info Lengkap</button>
            </div>
        </div>
        <div class="hero-fade"></div>
    </section>

    <!-- 3. KONTEN UTAMA (BARIS FILM) -->
    <main class="main-content">
        
        <!-- Baris Kategori 1: Sedang Tren -->
        <section class="content-row">
            <h2 class="row-title">Sedang Tren</h2>
            <div class="movie-carousel">
                <!-- Kartu Film -->
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/e81313/ffffff?text=Movie+1" alt="Movie 1">
                </div>
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/135ee8/ffffff?text=Movie+2" alt="Movie 2">
                </div>
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/13e85e/000000?text=Movie+3" alt="Movie 3">
                </div>
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/e8e513/000000?text=Movie+4" alt="Movie 4">
                </div>
                 <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/e813c9/ffffff?text=Movie+5" alt="Movie 5">
                </div>
            </div>
        </section>

        <!-- Baris Kategori 2: Film Indonesia Populer -->
        <section class="content-row">
            <h2 class="row-title">Film Indonesia Populer</h2>
            <div class="movie-carousel">
                <!-- Kartu Film -->
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/333/fff?text=Lokal+1" alt="Movie 1">
                </div>
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/333/fff?text=Lokal+2" alt="Movie 2">
                </div>
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/333/fff?text=Lokal+3" alt="Movie 3">
                </div>
                <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/333/fff?text=Lokal+4" alt="Movie 4">
                </div>
                 <div class="movie-card">
                    <img src="https://via.placeholder.com/200x300/333/fff?text=Lokal+5" alt="Movie 5">
                </div>
            </div>
        </section>
        
    </main>
    
    <!-- FOOTER akan ditambahkan jika perlu -->

    <script src="script.js"></script>
</body>
</html>
